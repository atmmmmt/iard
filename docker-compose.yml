services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["iard_mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  iard_mongo_data:
