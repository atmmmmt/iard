# =============================================================================
# I.A.R.D Academy — Backend API  |  iard.prootech-agency.com
# =============================================================================
# الواجهة على   https://academy-iard.com           (استضافة منفصلة)
# الـ API على   https://iard.prootech-agency.com    (هذا السيرفر، Express على 5000)
#
# التركيب:
#   sudo cp nginx-iard.prootech-agency.com.conf /etc/nginx/sites-available/iard-api
#   sudo ln -s /etc/nginx/sites-available/iard-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d iard.prootech-agency.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name iard.prootech-agency.com;

    # يجب أن يكون >= MAX_UPLOAD_MB في server/.env
    client_max_body_size 20m;

    access_log /var/log/nginx/iard-api.access.log;
    error_log  /var/log/nginx/iard-api.error.log;

    server_tokens off;

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
