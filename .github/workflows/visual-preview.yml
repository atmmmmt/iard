name: Visual preview

on:
  push:
    branches:
      - chatgpt/course-admin-improvements

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/iard_academy_preview
      JWT_EXPIRES_IN: 8h
      COOKIE_NAME: iard_admin
      CLIENT_ORIGIN: http://127.0.0.1:3000
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 15
      ADMIN_NAME: IARD Preview Administrator
      ADMIN_EMAIL: admin@iard-academy.org
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Create ephemeral preview credentials
        run: |
          echo "ADMIN_PASSWORD=Preview-${GITHUB_RUN_ID}-Password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(node -e 'console.log(require("crypto").randomBytes(48).toString("hex"))')" >> "$GITHUB_ENV"
      - name: Prepare scripts
        run: chmod +x scripts/*.sh
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Seed preview database
        run: |
          npm --prefix server run seed
          node server/src/seed-preview.js
      - name: Start API
        run: |
          npm --prefix server start > /tmp/iard-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5000/api/settings/public >/dev/null && exit 0; sleep 1; done
          cat /tmp/iard-api.log
          exit 1
      - name: Start frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/iard-front.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:3000/admin/login >/dev/null && exit 0; sleep 1; done
          cat /tmp/iard-front.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node scripts/capture-preview.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iard-preview-screenshots
          path: preview-screenshots/*.png
          if-no-files-found: error
