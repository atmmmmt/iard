name: Fix course delete copy

on:
  push:
    branches:
      - chatgpt/course-admin-improvements
    paths:
      - .github/workflows/fix-course-delete-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/course-admin-improvements
      - name: Update delete wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.tsx')
          s = p.read_text()
          old_fn = 'async function archive(c: Course) { if (!confirm(t(lang, `أرشفة الدورة ${c.code}؟`, `Archive ${c.code}?`))) return; try { await apiFetch(`/admin/courses/${c._id}`, { method: "DELETE" }); notify(t(lang, "تمت الأرشفة", "Archived")); reload(); } catch (e) { notify(errMsg(e)); } }'
          new_fn = 'async function removeCourse(c: Course) { if (!confirm(t(lang, `حذف الدورة ${c.code} نهائياً؟ لا يمكن التراجع عن هذا الإجراء.`, `Permanently delete ${c.code}? This cannot be undone.`))) return; try { await apiFetch(`/admin/courses/${c._id}`, { method: "DELETE" }); notify(t(lang, "تم حذف الدورة نهائياً", "Course permanently deleted")); reload(); } catch (e) { notify(errMsg(e)); } }'
          old_btn = '{c.status !== "archived" && <button onClick={() => archive(c)}><Trash2 /></button>}'
          new_btn = '<button onClick={() => removeCourse(c)} title={t(lang, "حذف نهائي", "Delete permanently")}><Trash2 /></button>'
          if old_fn not in s or old_btn not in s:
              raise SystemExit('Expected course delete UI text not found')
          s = s.replace(old_fn, new_fn, 1).replace(old_btn, new_btn, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git commit -m "Clarify permanent course deletion"
          git push origin HEAD:chatgpt/course-admin-improvements
