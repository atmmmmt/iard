name: Validate preview

on:
  push:
    branches:
      - chatgpt/course-admin-improvements
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Prepare scripts
        run: chmod +x scripts/*.sh
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        run: npm --prefix server ci
      - name: Check backend syntax
        run: node --check server/src/server.js && node --check server/src/routes/admin.js && node --check server/src/routes/public.js && node --check server/src/models/index.js
